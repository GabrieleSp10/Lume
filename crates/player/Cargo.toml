[package]
name = "app_player"
version.workspace = true
edition.workspace = true

[features]
default = ["librespot"]
# Experimental engine; it pulls in a large dependency tree of its own.
librespot = ["dep:librespot-core", "dep:librespot-playback", "dep:tokio"]

[dependencies]
app_core = { version = "0.2.2", path = "../core" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
tiny_http = "0.12.0"
ureq = "3"
wry = "0.57.1"
librespot-core = { version = "0.8.0", optional = true }
librespot-playback = { version = "0.8.0", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread"], optional = true }
