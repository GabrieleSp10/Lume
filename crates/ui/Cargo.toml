[package]
name = "app_ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lume"
path = "src/main.rs"

[dependencies]
app_core = { version = "0.1.0", path = "../core" }
app_player = { version = "0.1.0", path = "../player" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.18.1", features = ["raw-window-handle-06", "unstable-winit-030", "image-default-formats", "renderer-femtovg-wgpu", "unstable-wgpu-30"] }
ureq = "3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"
